<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاشة العرض | حروف مع أسامة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #06080f;
            --surface: rgba(17, 25, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --team1: #f97316;
            --team1-glow: rgba(249, 115, 22, 0.3);
            --team2: #22c55e;
            --team2-glow: rgba(34, 197, 94, 0.3);
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --cyan: #22d3ee;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --muted: #64748b;
            --amber: #fbbf24;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        /* Cinematic Live Background */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(ellipse 800px 800px at 20% 50%, rgba(249, 115, 22, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 800px 800px at 80% 50%, rgba(34, 197, 94, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 600px 600px at 50% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgBreath 15s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        @keyframes bgBreath {
            0% {
                transform: scale(1) rotate(0deg);
            }

            100% {
                transform: scale(1.1) rotate(3deg);
            }
        }

        /* Grid overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== Layout ===== */
        .display-layout {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* ===== Top Score Bar ===== */
        .score-bar {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 0;
            padding: 0;
            flex-shrink: 0;
            height: 100px;
        }

        .score-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 40px;
            position: relative;
        }

        .score-panel.team1-panel {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(249, 115, 22, 0.05));
            border-bottom: 3px solid var(--team1);
        }

        .score-panel.team2-panel {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.05), rgba(34, 197, 94, 0.15));
            border-bottom: 3px solid var(--team2);
        }

        .score-panel .team-name {
            font-size: 1.4rem;
            font-weight: 800;
            opacity: 0.9;
        }

        .score-panel .team-score {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1;
        }

        .team1-panel .team-score {
            color: var(--team1);
        }

        .team2-panel .team-score {
            color: var(--team2);
        }

        .score-divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--glass-border), transparent);
            flex-shrink: 0;
        }

        /* ===== Center Area ===== */
        .center-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== Hex Map ===== */
        .hex-grid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.6);
            width: 100%;
            max-width: 950px;
            container-type: inline-size;
            position: relative;
            overflow: visible;
            border-top: 4px solid var(--team2);
            border-bottom: 4px solid var(--team2);
            border-left: 4px solid var(--team1);
            border-right: 4px solid var(--team1);
            box-shadow:
                inset 0 0 60px rgba(34, 197, 94, 0.08),
                inset 0 0 60px rgba(249, 115, 22, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(99, 102, 241, 0.15);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }

        .hex-grid-container.shake {
            animation: epicShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes epicShake {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translate3d(-8px, 4px, 0) rotate(-1deg);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translate3d(8px, -4px, 0) rotate(1deg);
            }
        }

        .hex-grid-container::before {
            content: '';
            position: absolute;
            top: -4px;
            bottom: -4px;
            left: -4px;
            right: -4px;
            border-radius: 28px;
            background:
                linear-gradient(to right, rgba(249, 115, 22, 0.2) 0%, transparent 20%, transparent 80%, rgba(249, 115, 22, 0.2) 100%),
                linear-gradient(to bottom, rgba(34, 197, 94, 0.2) 0%, transparent 20%, transparent 80%, rgba(34, 197, 94, 0.2) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .hex-grid-container.faded {
            opacity: 0;
            transform: scale(0.85) translateY(-20px);
            pointer-events: none;
            position: absolute;
        }

        .hex-row {
            display: flex;
            justify-content: center;
            margin-top: -4.32cqi;
        }

        .hex-row:first-child {
            margin-top: 0;
        }

        .hex-row:nth-child(odd) {
            transform: translateX(-3.75cqi);
        }

        .hex-row:nth-child(even) {
            transform: translateX(3.75cqi);
        }

        .hexagon {
            width: 15cqi;
            height: 17.32cqi;
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a2e;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6.5cqi;
            font-weight: 900;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.92) translateY(0);
            user-select: none;
            /* 3D Drop-shadow that works with clip-path */
            filter: drop-shadow(0px 10px 0px rgba(0, 0, 0, 0.5));
        }

        .hex-unclaimed {
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a2e;
            filter: drop-shadow(0px 8px 0px rgba(15, 23, 42, 0.8));
        }

        .hex-active {
            background: linear-gradient(135deg, #fef08a, #facc15);
            color: #1a1a2e;
            transform: scale(1.05) translateY(-4px);
            filter: drop-shadow(0px 12px 0px rgba(161, 98, 7, 0.8)) drop-shadow(0 0 20px rgba(250, 204, 21, 0.6));
        }

        .hex-team1 {
            background: linear-gradient(135deg, #fb923c, #ea580c);
            color: white;
            /* Pressed down effect when claimed */
            transform: scale(0.92) translateY(4px);
            filter: drop-shadow(0px 2px 0px rgba(154, 52, 18, 0.9)) drop-shadow(0 0 15px var(--team1-glow));
        }

        .hex-team2 {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            /* Pressed down effect when claimed */
            transform: scale(0.92) translateY(4px);
            filter: drop-shadow(0px 2px 0px rgba(21, 128, 61, 0.9)) drop-shadow(0 0 15px var(--team2-glow));
        }

        /* ===== Massive Letter ===== */
        .massive-letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 14rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--cyan), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.4));
        }

        .massive-letter.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px 30px;
            background: rgba(17, 25, 40, 0.8);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text2);
        }

        .status-text i {
            margin-left: 8px;
        }

        /* ===== Buzz Overlay ===== */
        .buzz-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 5vh;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .buzz-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .buzz-overlay.team1-bg {
            background: radial-gradient(ellipse at 50% 85%, rgba(249, 115, 22, 0.4) 0%, rgba(0, 0, 0, 0.7) 70%);
        }

        .buzz-overlay.team2-bg {
            background: radial-gradient(ellipse at 50% 85%, rgba(34, 197, 94, 0.4) 0%, rgba(0, 0, 0, 0.7) 70%);
        }

        .buzz-icon {
            font-size: 6rem;
            animation: buzzPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .buzz-player-name {
            font-size: 2.5rem;
            font-weight: 900;
        }

        .buzz-label {
            font-size: 1.2rem;
            color: var(--text2);
        }

        @keyframes buzzPop {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        /* ===== Tension Pulse (Heartbeat) ===== */
        .tension-active {
            animation: tensionPulse running 1s ease-in-out infinite alternate !important;
        }

        @keyframes tensionPulse {
            0% {
                box-shadow: inset 0 0 0px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.4);
            }
        }

        /* ===== Win Overlay ===== */
        .win-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-trophy {
            font-size: 8rem;
            color: var(--amber);
            animation: trophyFloat 2s ease-in-out infinite alternate;
        }

        @keyframes trophyFloat {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        .win-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-top: 16px;
            text-align: center;
        }

        .win-scores {
            display: flex;
            gap: 60px;
            margin-top: 24px;
        }

        .win-score-item {
            text-align: center;
        }

        .win-score-item .val {
            font-size: 4rem;
            font-weight: 900;
        }

        .win-score-item .lbl {
            font-size: 1rem;
            color: var(--text2);
            margin-top: 4px;
        }

        .win-score-item.s1 .val {
            color: var(--team1);
        }

        .win-score-item.s2 .val {
            color: var(--team2);
        }

        /* ===== Connection Badge ===== */
        .connection-badge {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 50;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text2);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--team2);
            animation: pulse 2s ease-in-out infinite;
        }

        .connection-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ===== Fullscreen Button ===== */
        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text2);
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-family: 'Tajawal', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            color: var(--amber);
            border-color: rgba(251, 191, 36, 0.3);
        }

        /* ===== Room Input ===== */
        .room-setup {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }

        .room-setup.hidden {
            display: none;
        }

        .room-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .room-card h2 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text), var(--amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .room-card p {
            color: var(--text2);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .room-input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 16px;
            transition: all 0.3s;
        }

        .room-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .room-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .room-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .score-bar {
                height: 80px;
            }

            .score-panel .team-name {
                font-size: 1rem;
            }

            .score-panel .team-score {
                font-size: 2.5rem;
            }

            .score-divider {
                display: none;
            }

            .hex-grid-container {
                max-width: 100%;
                padding: 20px 10px;
            }

            .massive-letter {
                font-size: 8rem;
            }

            .win-title {
                font-size: 2.2rem;
            }

            .win-trophy {
                font-size: 5rem;
            }

            .win-scores {
                gap: 30px;
            }

            .win-score-item .val {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Room Setup -->
    <div class="room-setup" id="roomSetup">
        <div class="room-card">
            <h2><i class="fas fa-tv"></i> شاشة العرض</h2>
            <p>أدخل كود الغرفة لعرض اللعبة على الشاشة الكبيرة</p>
            <input class="room-input" id="roomInput" type="text" placeholder="كود الغرفة" maxlength="10"
                autocomplete="off" />
            <button class="room-btn" onclick="joinDisplay()">
                <i class="fas fa-play"></i> ابدأ العرض
            </button>
        </div>
    </div>

    <!-- Display Layout -->
    <div class="display-layout" id="displayLayout" style="display:none;">
        <!-- Scores -->
        <div class="score-bar">
            <div class="score-panel team1-panel">
                <span class="team-name" id="teamName1">الفريق الأول</span>
                <span class="team-score" id="score1">0</span>
            </div>
            <div class="score-panel team2-panel">
                <span class="team-score" id="score2">0</span>
                <span class="team-name" id="teamName2">الفريق الثاني</span>
            </div>
            <div class="score-divider"></div>
        </div>

        <!-- Center: Map or Letter -->
        <div class="center-content">
            <div class="hex-grid-container" id="hexMap"></div>
            <div class="massive-letter" id="massiveLetter"></div>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <span class="status-text" id="statusText">
                <i class="fas fa-hourglass-half"></i> في انتظار بدء اللعبة...
            </span>
        </div>
    </div>

    <!-- Buzz Overlay -->
    <div class="buzz-overlay" id="buzzOverlay">
        <div class="buzz-icon" id="buzzIcon"></div>
        <div class="buzz-player-name" id="buzzPlayerName"></div>
        <div class="buzz-label">ضغط الجرس! 🔔</div>
    </div>

    <!-- Win Overlay -->
    <div class="win-overlay" id="winOverlay">
        <i class="fas fa-trophy win-trophy"></i>
        <div class="win-title" id="winTitle"></div>
        <div class="win-scores">
            <div class="win-score-item s1">
                <div class="val" id="winScore1">0</div>
                <div class="lbl" id="winTeam1">الفريق الأول</div>
            </div>
            <div class="win-score-item s2">
                <div class="val" id="winScore2">0</div>
                <div class="lbl" id="winTeam2">الفريق الثاني</div>
            </div>
        </div>
    </div>

    <!-- Connection Badge -->
    <div class="connection-badge" id="connBadge">
        <div class="connection-dot" id="connDot"></div>
        <span id="connText">متصل</span>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()">
        <i class="fas fa-expand"></i> ملء الشاشة
    </button>

    <!-- Audio -->
    <audio id="audioWin" src="/win.mp3" preload="auto"></audio>
    <audio id="audioCelebrate" src="/celebrate.mp3" preload="auto"></audio>
    <audio id="audioHeartbeat" src="/heartbeat.mp3" loop preload="auto"></audio>

    <script>
        const socket = io();
        const $ = id => document.getElementById(id);
        let currentMapData = [];
        let roomId = null;

        // Auto-fill room from URL
        const urlRoom = new URLSearchParams(window.location.search).get('room');
        if (urlRoom) {
            $('roomInput').value = urlRoom;
        }

        function joinDisplay() {
            roomId = $('roomInput').value.trim().toUpperCase();
            if (!roomId) return;
            socket.emit('display_join', { roomId });
            $('roomSetup').classList.add('hidden');
            $('displayLayout').style.display = 'flex';
            window.history.replaceState({}, '', `?room=${roomId}`);
        }

        $('roomInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') joinDisplay();
        });

        // Auto-join if room in URL
        if (urlRoom) {
            setTimeout(() => joinDisplay(), 200);
        }

        // Connection status
        socket.on('connect', () => {
            $('connDot').classList.remove('disconnected');
            $('connText').textContent = 'متصل';
        });
        socket.on('disconnect', () => {
            $('connDot').classList.add('disconnected');
            $('connText').textContent = 'غير متصل';
        });

        // Fullscreen toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => { });
                $('fsBtn').innerHTML = '<i class="fas fa-compress"></i> تصغير';
            } else {
                document.exitFullscreen();
                $('fsBtn').innerHTML = '<i class="fas fa-expand"></i> ملء الشاشة';
            }
        }

        // ── Render Hex Map ──
        function renderHexMap() {
            const container = $('hexMap');
            if (!container || !currentMapData.length) return;
            let rowLengths = [5, 5, 5, 5, 5];
            let html = '';
            let idx = 0;
            for (let r of rowLengths) {
                html += '<div class="hex-row">';
                for (let i = 0; i < r; i++) {
                    if (currentMapData[idx]) {
                        let cell = currentMapData[idx];
                        html += `<div class="hexagon hex-${cell.state}" id="dhex-${cell.id}">${cell.letter}</div>`;
                    }
                    idx++;
                }
                html += '</div>';
            }
            container.innerHTML = html;
        }

        // ── Epic Capture Anim ──
        function triggerEpicCapture(team) {
            const grid = $('hexMap');
            grid.classList.remove('shake');
            void grid.offsetWidth;
            grid.classList.add('shake');

            const colors = team === 1 ? ['#fb923c', '#ea580c'] : ['#4ade80', '#16a34a'];
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: colors,
                zIndex: 300
            });
        }

        function updateMapState(newHexMap) {
            if (!newHexMap || !currentMapData.length) return;
            let teamWon = null;
            currentMapData.forEach(c => {
                const oldState = c.state;
                const newState = newHexMap[c.id] || 'unclaimed';
                if ((oldState === 'unclaimed' || oldState === 'active') && (newState === 'team1' || newState === 'team2')) {
                    teamWon = newState === 'team1' ? 1 : 2;
                }
                c.state = newState;
            });
            renderHexMap();
            if (teamWon) triggerEpicCapture(teamWon);
        }

        // ── Game State ──
        let activeTensionTimer = null;
        let isTensionActive = false;

        function startTension(duration) {
            if (isTensionActive) return;
            isTensionActive = true;
            document.body.classList.add('tension-active');
            try {
                const hb = $('audioHeartbeat');
                hb.currentTime = 0;
                hb.playbackRate = 1.0;
                hb.play().catch(e => console.log('Audio disabled:', e));

                let timeElapsed = 0;
                activeTensionTimer = setInterval(() => {
                    timeElapsed += 0.5;
                    const progress = timeElapsed / duration;
                    if (progress > 0.5) hb.playbackRate = 1.2;
                    if (progress > 0.75) hb.playbackRate = 1.5;
                    if (progress >= 1) stopTension();
                }, 500);
            } catch (e) { }
        }

        function stopTension() {
            isTensionActive = false;
            document.body.classList.remove('tension-active');
            clearInterval(activeTensionTimer);
            try {
                const hb = $('audioHeartbeat');
                hb.pause();
                hb.currentTime = 0;
                hb.playbackRate = 1.0;
            } catch (e) { }
        }

        socket.on('game_state', ({ status, teamNames, hexMap, activeQuestion, scores }) => {
            if (teamNames) {
                $('teamName1').textContent = teamNames[1];
                $('teamName2').textContent = teamNames[2];
            }
            if (scores) {
                $('score1').textContent = scores[1] ?? 0;
                $('score2').textContent = scores[2] ?? 0;
            }
            updateMapState(hexMap);

            if (activeQuestion) {
                $('hexMap').classList.add('faded');
                $('massiveLetter').textContent = activeQuestion.letter;
                $('massiveLetter').classList.add('show');
            } else {
                $('hexMap').classList.remove('faded');
                $('massiveLetter').classList.remove('show');
            }

            // Tension handling
            if (status === 'first_locked' || status === 'steal_locked') {
                // If there's an active timer running on server, we should start tension
                // Since game_state doesn't have the remaining time, we start it on 'player_buzzed'
            } else {
                stopTension();
            }

            // Status text
            const statusMap = {
                'waiting': '<i class="fas fa-clock"></i> في انتظار السؤال...',
                'first_buzz': '<i class="fas fa-bell" style="color:#fbbf24"></i> السؤال مفتوح — اضغط الجرس!',
                'steal': '<i class="fas fa-hand-pointer" style="color:#22d3ee"></i> فرصة الجولة الثانية!',
                'open': '<i class="fas fa-globe" style="color:#22d3ee"></i> مفتوح للجميع!'
            };
            $('statusText').innerHTML = statusMap[status] || statusMap['waiting'];
        });

        socket.on('map_update', data => {
            currentMapData = data;
            renderHexMap();
        });

        socket.on('hex_update', ({ hexMap }) => {
            updateMapState(hexMap);
        });

        socket.on('hex_selected', ({ letter }) => {
            $('hexMap').classList.add('faded');
            $('massiveLetter').textContent = letter;
            setTimeout(() => $('massiveLetter').classList.add('show'), 50);
            let cell = currentMapData.find(c => c.id === letter);
            if (cell) { cell.state = 'active'; renderHexMap(); }
        });

        socket.on('roster_update', ({ scores, teamNames }) => {
            if (scores) {
                $('score1').textContent = scores[1] ?? 0;
                $('score2').textContent = scores[2] ?? 0;
            }
            if (teamNames) {
                $('teamName1').textContent = teamNames[1];
                $('teamName2').textContent = teamNames[2];
            }
        });

        // ── Buzz ──
        function renderIcon(iconValue) {
            return `<i class="fas ${iconValue}"></i>`;
        }

        socket.on('player_buzzed', ({ playerName, team, emoji, duration }) => {
            const overlay = $('buzzOverlay');
            overlay.className = `buzz-overlay show ${team === 1 ? 'team1-bg' : 'team2-bg'}`;
            $('buzzIcon').innerHTML = renderIcon(emoji);
            $('buzzIcon').style.color = team === 1 ? 'var(--team1)' : 'var(--team2)';
            $('buzzPlayerName').textContent = playerName;
            $('buzzPlayerName').style.color = team === 1 ? 'var(--team1)' : 'var(--team2)';

            if (duration) {
                startTension(duration);
            }
        });

        socket.on('answer_correct', () => {
            stopTension();
            $('buzzOverlay').classList.remove('show');
            confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 }, colors: ['#818cf8', '#f97316', '#22c55e', '#fbbf24'] });
        });

        socket.on('buzzer_wrong', () => {
            stopTension();
            $('buzzOverlay').classList.remove('show');
        });

        socket.on('question_started', () => {
            stopTension();
            $('buzzOverlay').classList.remove('show');
        });

        socket.on('steal_window', () => {
            stopTension();
            $('buzzOverlay').classList.remove('show');
        });

        socket.on('steal_expired', () => {
            stopTension();
            $('buzzOverlay').classList.remove('show');
        });

        // ── End Game / Win ──
        socket.on('end_game', ({ teamName, scores, teamNames }) => {
            stopTension();
            const overlay = $('winOverlay');
            $('winTitle').textContent = '🏆 ' + teamName + ' هو الفائز!';
            if (scores) {
                $('winScore1').textContent = scores[1] ?? 0;
                $('winScore2').textContent = scores[2] ?? 0;
            }
            if (teamNames) {
                $('winTeam1').textContent = teamNames[1];
                $('winTeam2').textContent = teamNames[2];
            }
            overlay.classList.add('show');
            try { $('audioWin').play().catch(() => { }); } catch (e) { }
            let elapsed = 0;
            const loop = setInterval(() => {
                confetti({ particleCount: 80, spread: 90, origin: { y: 0.5 }, colors: ['#818cf8', '#f97316', '#22c55e', '#fbbf24'] });
                elapsed += 600;
                if (elapsed >= 6000) clearInterval(loop);
            }, 600);
        });

        socket.on('round_win', ({ teamName }) => {
            const overlay = $('winOverlay');
            $('winTitle').textContent = '🏁 ' + teamName + ' فاز بالجولة!';
            overlay.classList.add('show');
            try { $('audioWin').play().catch(() => { }); } catch (e) { }
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            setTimeout(() => overlay.classList.remove('show'), 5000);
        });

        socket.on('destroy_game', () => location.reload());
    </script>
</body>

</html>
