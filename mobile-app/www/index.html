<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دخول اللعبة</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.8rem;
    }

    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 2px solid #334155;
      border-radius: 0.5rem;
      background: #0f172a;
      color: white;
      font-size: 1.1rem;
      box-sizing: border-box;
      outline: none;
      direction: ltr;
      text-align: center;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0ea5e9;
    }

    .error {
      color: #ef4444;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>حروف مع أسامة</h1>
    <p>أدخل رابط الغرفة للاتصال باللعبة</p>
    <input type="text" id="serverUrl" placeholder="مثال: https://1234.ngrok-free.app" />
    <button onclick="connect()">اتصال باللعبة</button>
    <div id="errorMsg" class="error">الرجاء إدخال رابط صحيح أو التحقق من الاتصال</div>
  </div>

  <script>
    // Load last used URL
    const lastUrl = localStorage.getItem('triviaServerUrl');
    if (lastUrl) {
      document.getElementById('serverUrl').value = lastUrl;
    }

    function connect() {
      const urlInput = document.getElementById('serverUrl').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      if (!urlInput) {
        errorMsg.style.display = 'block';
        return;
      }

      let finalUrl = urlInput;
      if (!/^https?:\/\//i.test(finalUrl)) {
        finalUrl = 'https://' + finalUrl;
      }

      // Save to local storage for convenience
      localStorage.setItem('triviaServerUrl', finalUrl);

      // Attempt to navigate to the player index via smooth transition
      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.inset = '0';
      overlay.style.background = '#0f172a';
      overlay.style.zIndex = '9999';
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.5s ease';
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';

      const loader = document.createElement('div');
      loader.style.width = '50px';
      loader.style.height = '50px';
      loader.style.border = '4px solid rgba(56, 189, 248, 0.2)';
      loader.style.borderTopColor = '#38bdf8';
      loader.style.borderRadius = '50%';
      loader.style.animation = 'spin 1s linear infinite';

      const text = document.createElement('div');
      text.textContent = 'جاري الاتصال...';
      text.style.color = '#38bdf8';
      text.style.marginTop = '20px';
      text.style.fontWeight = 'bold';
      text.style.fontSize = '1.1rem';

      const style = document.createElement('style');
      style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
      document.head.appendChild(style);

      overlay.appendChild(loader);
      overlay.appendChild(text);
      document.body.appendChild(overlay);

      requestAnimationFrame(() => {
        overlay.style.opacity = '1';
      });

      setTimeout(() => {
        window.location.href = finalUrl;
      }, 600);
    }
  </script>
</body>

</html>
