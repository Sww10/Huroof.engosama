<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التوجيه... | حروف مع أسامة</title>
    <link rel="icon" href="/Logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background: rgba(6, 8, 15, 1);
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ===== Liquid Blob Animation ===== */
        .blob-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 100vmax;
            height: 100vmax;
            background: linear-gradient(135deg, #6366f1, #22d3ee, #a78bfa);
            box-shadow: 0 0 100px 20px #6366f1;
            animation: blobExpand 1.2s cubic-bezier(0.7, 0, 0.2, 1) both;
        }

        @keyframes blobExpand {
            0% {
                transform: scale(0);
                opacity: 0;
                border-radius: 100%;
            }

            40% {
                transform: scale(0.15);
                opacity: 1;
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }

            100% {
                transform: scale(3.5);
                opacity: 1;
                border-radius: 10%;
            }
        }

        /* ===== Blur Layer ===== */
        .blur-layer {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 2;
            background: rgba(6, 8, 15, 0.6);
            animation: blurFade 0.8s ease 0.4s both;
        }

        @keyframes blurFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ===== Selection UI ===== */
        .content-wrapper {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            animation: uiFloat 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both;
        }

        .text-content {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            letter-spacing: 0px;
            text-align: center;
        }

        .text-content span {
            color: #22d3ee;
        }

        @keyframes uiFloat {
            from {
                opacity: 0;
                transform: translateY(15px) translateZ(0);
                filter: blur(4px);
                -webkit-filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
                filter: blur(0px);
                -webkit-filter: blur(0px);
            }
        }

        .buttons-container {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .device-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.25rem 2.5rem;
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .device-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .device-btn:hover::before {
            left: 100%;
        }

        .device-btn:hover {
            background: rgba(34, 211, 238, 0.1);
            border-color: #22d3ee;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(34, 211, 238, 0.2);
        }

        .device-btn svg {
            color: #22d3ee;
            width: 32px;
            height: 32px;
            transition: transform 0.3s ease;
        }

        .device-btn:hover svg {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="blob-container">
        <div class="blob"></div>
    </div>
    <div class="blur-layer"></div>

    <div class="content-wrapper">
        <div class="text-content">
            حدد نوع <span>جهازك</span>
        </div>
        <div class="buttons-container">
            <button class="device-btn" id="btn-pc">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                كمبيوتر
            </button>
            <button class="device-btn" id="btn-mobile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                جوال
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // استخراج كود الغرفة من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const roomCode = urlParams.get('room');


            // التعامل مع الأزرار
            document.getElementById('btn-pc').addEventListener('click', () => {
                let target = '/home.html';
                if (roomCode && roomCode.trim() !== '') {
                    target = '/index.html?room=' + encodeURIComponent(roomCode.trim());
                }
                window.location.replace(target);
            });

            document.getElementById('btn-mobile').addEventListener('click', () => {
                let target = '/home.html';
                if (roomCode && roomCode.trim() !== '') {
                    target = '/index_mobile.html?room=' + encodeURIComponent(roomCode.trim());
                }
                window.location.replace(target);
            });
        });
    </script>
</body>

</html>
