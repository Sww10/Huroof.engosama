<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الدفع بنجاح!</title>
  <link rel="icon" href="/Logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
      color: white;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 28px;
      padding: 50px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 2.5rem;
      box-shadow: 0 12px 30px rgba(34, 197, 94, 0.4);
      animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 1rem; margin-bottom: 30px; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>تم الدفع بنجاح!</h1>
    <p>شكراً لك! تم فتح اللعبة على حسابك بشكل دائم. يمكنك الآن اللعب في أي وقت.</p>
    <a href="/home.html" class="btn" id="playBtn">🎮 ابدأ اللعب الآن</a>
  </div>

  <script>
    // Confirm payment on backend
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      localStorage.setItem('game_user_email', email);
      localStorage.setItem('game_user_paid', 'true');
      fetch('/api/confirm-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      }).catch(() => {});
    }
  </script>
</body>
</html>
